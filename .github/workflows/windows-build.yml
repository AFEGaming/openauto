name: Windows Build Fix Protobuf

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout OpenAuto
        uses: actions/checkout@v4
        with:
          repository: f1xpl/openauto
          path: openauto

      - name: Checkout aasdk
        uses: actions/checkout@v4
        with:
          repository: f1xpl/aasdk
          path: aasdk

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies via VCPKG
        run: |
          vcpkg install boost-asio boost-system boost-thread protobuf openssl libusb rtaudio --triplet x64-windows

      - name: Build aasdk
        run: |
          cd aasdk
          mkdir build
          cd build
          # Protobuf hatasını engellemek için -Dprotobuf_MODULE_COMPATIBLE=ON ekledik
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -Dprotobuf_MODULE_COMPATIBLE=ON
          cmake --build . --config Release

      - name: Build OpenAuto
        run: |
          cd openauto
          mkdir build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -Daasdk_DIR="${{ github.workspace }}/aasdk/build" -DCMAKE_BUILD_TYPE=Release -Dprotobuf_MODULE_COMPATIBLE=ON
          cmake --build . --config Release

      - name: Bundle DLLs
        run: |
          windeployqt --release --no-translations --compiler-runtime openauto/build/bin/Release/openauto.exe

      - name: Upload Build Result
        uses: actions/upload-artifact@v4
        with:
          name: OpenAuto-Windows-Package
          path: openauto/build/bin/Release/
